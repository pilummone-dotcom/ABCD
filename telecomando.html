<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABCD Telecomando</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:flex;flex-direction:column;padding:18px;box-sizing:border-box}
h1{font-size:22px;text-align:center;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
button{font-size:min(25vw,150px);font-weight:800;border:0;border-radius:24px;background:#f2c230;color:#111;touch-action:manipulation}
#status{text-align:center;margin-top:12px;min-height:24px;font-size:16px}
</style></head>
<body><h1>TELECOMANDO</h1><div class="grid">
<button data-l="A">A</button><button data-l="B">B</button>
<button data-l="C">C</button><button data-l="D">D</button>
</div><div id="status">Pronto</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD5lYqbiGpTMTww4xWZfSTWgWna-RsbdWw",
  authDomain: "abcd-61428.firebaseapp.com",
  databaseURL: "https://abcd-61428-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "abcd-61428",
  storageBucket: "abcd-61428.firebasestorage.app",
  messagingSenderId: "432610776757",
  appId: "1:432610776757:web:2d75f20d3a6880c00350fc"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app), status=document.querySelector("#status");
document.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
 try{await set(ref(db,"lettera"),b.dataset.l);status.textContent="Inviata: "+b.dataset.l}
 catch(e){status.textContent="Errore: "+e.message}
});
</script></body></html>
